<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fitness App Test</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, Helvetica, sans-serif;
        background: #f5f7fb;
        color: #182033;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 460px);
        padding: 32px;
        border: 1px solid #dce3f0;
        border-radius: 8px;
        background: #ffffff;
        box-shadow: 0 16px 40px rgba(24, 32, 51, 0.08);
      }

      h1 {
        margin: 0 0 12px;
        font-size: 2rem;
        line-height: 1.1;
      }

      p {
        margin: 0 0 24px;
        line-height: 1.6;
        color: #4b5875;
      }

      button {
        width: 100%;
        border: 0;
        border-radius: 6px;
        padding: 14px 18px;
        background: #1d7f5f;
        color: #ffffff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button:hover {
        background: #176b50;
      }

      output {
        display: block;
        min-height: 24px;
        margin-top: 20px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Fitness App Test</h1>
      <p>Een eerste simpele HTML-webapp om te testen of GitHub en Vercel goed werken.</p>
      <button type="button" id="checkInButton">Check-in training</button>
      <output id="status" aria-live="polite"></output>
    </main>

    <script>
      const button = document.querySelector("#checkInButton");
      const status = document.querySelector("#status");

      button.addEventListener("click", () => {
        const now = new Date().toLocaleTimeString("nl-NL", {
          hour: "2-digit",
          minute: "2-digit"
        });

        status.textContent = `Training gecheckt om ${now}.`;
      });
    </script>
  </body>
</html>
