<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fitness Manager</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0a0a0a;
        --panel: #161616;
        --panel-strong: #1f1f1f;
        --line: #2a2a2a;
        --text: #ffffff;
        --muted: #9e9e9e;
        --soft: #555555;
        --accent: #ff6b35;
        --accent-2: #ff8c42;
        --blue: #4fc3f7;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background: var(--bg);
        color: var(--text);
      }

      button,
      a {
        -webkit-tap-highlight-color: transparent;
      }

      .app {
        min-height: 100vh;
        background: var(--bg);
        padding-bottom: 96px;
      }

      .hero {
        padding: 32px 24px 40px;
        background:
          radial-gradient(circle at 82% 8%, rgba(79, 195, 247, 0.12), transparent 26%),
          linear-gradient(180deg, #2a1000 0%, rgba(255, 107, 53, 0.14) 47%, var(--bg) 100%);
      }

      .hero-copy {
        display: grid;
        gap: 4px;
        margin-bottom: 24px;
      }

      .eyebrow,
      .goal,
      .muted {
        color: var(--muted);
        font-size: 15px;
        line-height: 1.35;
      }

      h1 {
        margin: 0;
        font-size: 34px;
        line-height: 1;
        letter-spacing: 0;
        font-weight: 900;
      }

      h2 {
        margin: 0;
        font-size: 17px;
        line-height: 1.2;
      }

      .primary-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 46px;
        border: 0;
        border-radius: 12px;
        padding: 12px 24px;
        background: linear-gradient(180deg, var(--accent), var(--accent-2));
        color: var(--text);
        font: inherit;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 4px 12px rgba(255, 107, 53, 0.35);
      }

      .primary-button:active,
      .tile:active,
      .exercise:active {
        transform: translateY(1px);
      }

      .section {
        padding: 0 24px;
        margin-top: 24px;
      }

      .section-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }

      .link-button {
        border: 0;
        background: transparent;
        color: var(--accent);
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
      }

      .stat-card,
      .tile,
      .exercise {
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--panel);
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
      }

      .stat-card {
        min-width: 0;
        padding: 16px;
        display: grid;
        gap: 8px;
      }

      .icon-box {
        width: 36px;
        height: 36px;
        display: grid;
        place-items: center;
        border-radius: 8px;
        background: rgba(255, 107, 53, 0.1);
        color: var(--accent);
      }

      .icon-box.neutral {
        background: var(--panel-strong);
        color: var(--muted);
      }

      .icon-box svg,
      .nav-item svg,
      .primary-button svg {
        width: 20px;
        height: 20px;
        stroke: currentColor;
        stroke-width: 2;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .stat-value {
        min-height: 38px;
        font-size: 24px;
        line-height: 1.1;
        font-weight: 900;
      }

      .stat-label {
        color: var(--muted);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 1px;
        line-height: 1.2;
        text-transform: uppercase;
      }

      .quick-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .tile {
        min-height: 134px;
        padding: 16px;
        display: grid;
        align-content: start;
        gap: 10px;
        color: inherit;
        font: inherit;
        cursor: pointer;
        text-align: left;
        text-decoration: none;
      }

      .tile-title,
      .exercise-title {
        font-size: 15px;
        font-weight: 700;
        line-height: 1.25;
      }

      .tile-meta,
      .exercise-muscle {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.3;
      }

      .exercise-list {
        display: grid;
        gap: 8px;
      }

      .exercise {
        width: 100%;
        min-height: 82px;
        border-radius: 16px;
        padding: 16px;
        display: grid;
        grid-template-columns: 48px minmax(0, 1fr) 20px;
        align-items: center;
        gap: 12px;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }

      .exercise-main {
        min-width: 0;
        display: grid;
        gap: 4px;
      }

      .exercise-title,
      .exercise-muscle {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .badge {
        width: fit-content;
        border-radius: 999px;
        padding: 4px 8px;
        background: #1e3a5f;
        color: var(--blue);
        font-size: 11px;
        font-weight: 700;
      }

      .badge.expert {
        background: #3d1a00;
        color: var(--accent);
      }

      .chevron {
        color: var(--soft);
      }

      .bottom-nav {
        position: fixed;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 10;
        height: 80px;
        border-top: 1px solid var(--line);
        background: #161616;
        padding: 8px 10px 16px;
      }

      .nav-inner {
        height: 100%;
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .nav-item {
        display: grid;
        place-items: center;
        align-content: center;
        gap: 4px;
        color: var(--soft);
        font-size: 11px;
        font-weight: 600;
        text-decoration: none;
      }

      .nav-item.active {
        color: var(--accent);
      }

      .toast {
        position: fixed;
        right: 20px;
        bottom: 96px;
        left: 20px;
        z-index: 20;
        min-height: 44px;
        display: none;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(255, 107, 53, 0.35);
        border-radius: 12px;
        background: #1f1f1f;
        color: var(--text);
        font-size: 14px;
        font-weight: 700;
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5);
      }

      .toast.show {
        display: flex;
      }

      @media (min-width: 720px) {
        body {
          display: grid;
          justify-items: center;
          background: #050505;
        }

        .app {
          width: min(100%, 520px);
          border-right: 1px solid #191919;
          border-left: 1px solid #191919;
        }

        .bottom-nav {
          left: 50%;
          width: min(100%, 520px);
          transform: translateX(-50%);
        }
      }

      @media (max-width: 430px) {
        .stats {
          grid-template-columns: 1fr;
        }

        .stat-card {
          grid-template-columns: 36px minmax(0, 1fr);
          align-items: center;
        }

        .stat-label {
          grid-column: 2;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <section class="hero">
        <div class="hero-copy">
          <div class="eyebrow">Goedemorgen,</div>
          <h1>Atleet 👋</h1>
          <div class="goal">Doel: Algemene Fitness</div>
        </div>

        <button class="primary-button" type="button" data-action="start-workout">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg>
          Start Workout
        </button>
      </section>

      <section class="section" aria-labelledby="overview-title">
        <div class="section-header">
          <h2 id="overview-title">Overzicht</h2>
        </div>

        <div class="stats">
          <article class="stat-card">
            <div class="icon-box">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14"></path><path d="M18 5v14"></path><path d="M3 8v8"></path><path d="M21 8v8"></path><path d="M6 12h12"></path></svg>
            </div>
            <div class="stat-value">3</div>
            <div class="stat-label">Workouts / week</div>
          </article>

          <article class="stat-card">
            <div class="icon-box neutral">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l3 7h7l-5.5 4.5L18.5 21 12 17l-6.5 4 2-7.5L2 9h7z"></path></svg>
            </div>
            <div class="stat-value">Gevorderd</div>
            <div class="stat-label">Niveau</div>
          </article>

          <article class="stat-card">
            <div class="icon-box neutral">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="3"></circle></svg>
            </div>
            <div class="stat-value">1</div>
            <div class="stat-label">Doelen</div>
          </article>
        </div>
      </section>

      <section class="section" aria-labelledby="quick-title">
        <div class="section-header">
          <h2 id="quick-title">Snel starten</h2>
        </div>

        <div class="quick-grid">
          <a class="tile" href="#oefeningen">
            <div class="icon-box">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5"></path><path d="M8 19V5"></path><path d="M16 19V5"></path><path d="M20 19V5"></path><path d="M8 12h8"></path></svg>
            </div>
            <div class="tile-title">Oefeningen</div>
            <div class="tile-meta">12 beschikbaar</div>
          </a>

          <button class="tile" type="button" data-action="stopwatch">
            <div class="icon-box">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 2h4"></path><path d="M12 14l3-3"></path><circle cx="12" cy="14" r="8"></circle></svg>
            </div>
            <div class="tile-title">Stopwatch</div>
            <div class="tile-meta">Track je tijd</div>
          </button>
        </div>
      </section>

      <section class="section" id="oefeningen" aria-labelledby="recommended-title">
        <div class="section-header">
          <h2 id="recommended-title">Aanbevolen</h2>
          <button class="link-button" type="button" data-action="all">Alles zien</button>
        </div>

        <div class="exercise-list">
          <button class="exercise" type="button" data-exercise="Bench Press">
            <div class="icon-box">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14"></path><path d="M18 5v14"></path><path d="M6 12h12"></path><path d="M3 9v6"></path><path d="M21 9v6"></path></svg>
            </div>
            <span class="exercise-main">
              <span class="exercise-title">Bench Press</span>
              <span class="exercise-muscle">Borst midden/onder</span>
              <span class="badge">Gevorderd</span>
            </span>
            <span class="chevron">›</span>
          </button>

          <button class="exercise" type="button" data-exercise="Deadlift">
            <div class="icon-box">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 18h14"></path><path d="M7 18l2-8h6l2 8"></path><path d="M9 10l3-5 3 5"></path></svg>
            </div>
            <span class="exercise-main">
              <span class="exercise-title">Deadlift</span>
              <span class="exercise-muscle">Hamstrings</span>
              <span class="badge expert">Expert</span>
            </span>
            <span class="chevron">›</span>
          </button>

          <button class="exercise" type="button" data-exercise="Squat">
            <div class="icon-box">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 20v-4l3-4"></path><path d="M17 20v-4l-3-4"></path><path d="M8 8h8"></path><path d="M12 4v8"></path></svg>
            </div>
            <span class="exercise-main">
              <span class="exercise-title">Squat</span>
              <span class="exercise-muscle">Quadriceps</span>
              <span class="badge">Gevorderd</span>
            </span>
            <span class="chevron">›</span>
          </button>
        </div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="Hoofdnavigatie">
      <div class="nav-inner">
        <a class="nav-item active" href="#">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5L12 3l9 7.5"></path><path d="M5 10v10h14V10"></path></svg>
          Home
        </a>
        <a class="nav-item" href="#oefeningen">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5"></path><path d="M8 19V5"></path><path d="M16 19V5"></path><path d="M20 19V5"></path><path d="M8 12h8"></path></svg>
          Oefeningen
        </a>
        <a class="nav-item" href="#workout">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg>
          Workout
        </a>
        <a class="nav-item" href="#profiel">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.2-6 8-6s6.5 2 8 6"></path></svg>
          Profiel
        </a>
      </div>
    </nav>

    <output class="toast" id="toast" aria-live="polite"></output>

    <script>
      const toast = document.querySelector("#toast");
      let toastTimer;

      function showToast(message) {
        window.clearTimeout(toastTimer);
        toast.textContent = message;
        toast.classList.add("show");
        toastTimer = window.setTimeout(() => toast.classList.remove("show"), 2200);
      }

      document.querySelector("[data-action='start-workout']").addEventListener("click", () => {
        showToast("Workout gestart.");
      });

      document.querySelector("[data-action='stopwatch']").addEventListener("click", () => {
        showToast("Stopwatch klaar om te starten.");
      });

      document.querySelector("[data-action='all']").addEventListener("click", () => {
        showToast("Alle oefeningen komen in de volgende versie.");
      });

      document.querySelectorAll("[data-exercise]").forEach((button) => {
        button.addEventListener("click", () => {
          showToast(`${button.dataset.exercise} geselecteerd.`);
        });
      });
    </script>
  </body>
</html>
